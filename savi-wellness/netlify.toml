[build]
  # PRÉVIA: permite dados pendentes (noindex + selo "Prévia").
  # Quando src/config/site.ts estiver completo e revisado, troque para: npm run build
  command = "npm run build:preview"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Prévia (deploy previews / branches): permite pendências e gera noindex
[context.deploy-preview]
  command = "npm run build:preview"
[context.branch-deploy]
  command = "npm run build:preview"
